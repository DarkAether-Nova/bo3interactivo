<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent !important;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Cuadrícula de 2 arriba y 2 abajo (2x2) */
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px 40px; /* 20px separación vertical, 40px separación horizontal */
      justify-items: center;
      align-items: flex-start;
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
      opacity: 1;
      transform: scale(1);
    }

    .grid-4.oculto {
      opacity: 0;
      transform: scale(0.95);
    }

    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 155px;
    }

    /* Título (Nombre): Alineado arriba (flex-start) */
    .item .titulo {
      height: 38px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      margin-bottom: 6px;
      color: #ffffff;
      font-weight: 900;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      line-height: 1.1;
      text-shadow: 
        2px 2px 0 #000,
       -1px -1px 0 #000,
        1px -1px 0 #000,
       -1px 1px 0 #000,
        0px 4px 8px rgba(0, 0, 0, 0.95);
      text-align: center;
      white-space: normal;
    }

    /* Icono PNG: Tamaño y posición fijos */
    .item img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0px 8px 14px rgba(0, 0, 0, 0.85));
    }

    /* Subtítulo (Descripción): Alineado arriba (flex-start) */
    .item .subtitulo {
      height: 38px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      margin-top: 6px;
      color: #ffea00;
      font-weight: 900;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      line-height: 1.1;
      text-shadow: 
        2px 2px 0 #000,
       -2px -2px 0 #000,
        2px -2px 0 #000,
       -2px 2px 0 #000,
        0px 4px 8px rgba(0, 0, 0, 0.95);
      text-align: center;
      white-space: normal;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="grid-4" id="contenedor"></div>
  </div>

  <script>
    const regalos = [
      { archivo: "regalos/Rosa.png", nombre: "Rosa", descripcion: "x5<br>Zombis" },
      { archivo: "regalos/Fuegos Artificiales.png", nombre: "fuegos<br>artificiales", descripcion: "luz roja<br>luz verde" },
      { archivo: "regalos/GG.png", nombre: "GG", descripcion: "Perk<br>Random" },
      { archivo: "regalos/Helado.png", nombre: "Helado.", descripcion: "Quitar<br>un Perk" },
      { archivo: "regalos/Corazon Coreano.png", nombre: "cozazòn<br>Coreano", descripcion: "+1000<br>puntos" },
      { archivo: "regalos/Globos.png", nombre: "Globos", descripcion: "Quitar<br>puntos" },
      { archivo: "regalos/Maracas.png", nombre: "Maracas", descripcion: "Doble<br>puntuación" },
      { archivo: "regalos/Sombrero y bigote.png", nombre: "Sombrero y<br> bigote", descripcion: "Reinicio" },
      { archivo: "regalos/Rosa Blanca.png", nombre: "Rosa<br>Blanca", descripcion: "Munición<br>Máxima" },
      { archivo: "regalos/alas de guardian.png", nombre: "Alas de Guardiàn", descripcion: "Arma<br>aleatoria" },
      { archivo: "regalos/Pastel.png", nombre: "Pastel", descripcion: "Muerte<br>Instantánea" },
      { archivo: "regalos/pop.png", nombre: "pop", descripcion: "Kaboom" },
      { archivo: "regalos/Te Adoro.png", nombre: "Te Adoro", descripcion: "potenciador<br>aleatorio" },
      { archivo: "regalos/Corazón.png", nombre: "Corazón", descripcion: "Controles<br>Congelados" },
      { archivo: "regalos/Capibara.png", nombre: "Capibara", descripcion: "subir a<br>Ronda 50" },
      { archivo: "regalos/Dona.png", nombre: "Dona", descripcion: "Me quita<br>todas las perks" },
      { archivo: "regalos/collar de amistad.png", nombre: "collar de<br> amistad", descripcion: "Ruleta<br>extrema" }
    ];

    const contenedor = document.getElementById('contenedor');
    let indiceActual = 0;
    const tiempoVisibilidad = 6000;

    function mostrarSiguienteGrupo() {
      contenedor.classList.add('oculto');

      setTimeout(() => {
        let grupo = regalos.slice(indiceActual, indiceActual + 4);

        if (grupo.length < 4) {
          const faltantes = 4 - grupo.length;
          const disponibles = regalos.filter(r => !grupo.includes(r));
          const aleatorios = disponibles.sort(() => 0.5 - Math.random()).slice(0, faltantes);
          grupo = [...grupo, ...aleatorios];
        }

        contenedor.innerHTML = grupo.map(item => `
          <div class="item">
            <span class="titulo">${item.nombre}</span>
            <img src="${encodeURI(item.archivo)}" alt="Regalo">
            <span class="subtitulo">${item.descripcion}</span>
          </div>
        `).join('');

        contenedor.classList.remove('oculto');

        indiceActual += 4;
        if (indiceActual >= regalos.length) {
          indiceActual = 0;
        }
      }, 500);
    }

    mostrarSiguienteGrupo();
    setInterval(mostrarSiguienteGrupo, tiempoVisibilidad);
  </script>

</body>
</html>
