<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent !important;
      overflow: hidden;
      font-family: 'Fredoka', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Columna Vertical de 3 elementos */
    .grid-3-vertical {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      justify-items: center;
      align-items: center;
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
      opacity: 1;
      transform: scale(1);
    }

    .grid-3-vertical.oculto {
      opacity: 0;
      transform: scale(0.95);
    }

    .item {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      width: 360px;
      gap: 16px;
    }

    .item .img-box {
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item .img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0px 8px 14px rgba(0, 0, 0, 0.9));
    }

    .item .info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
    }

    .item .titulo {
      color: #ffffff;
      font-weight: 900;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      line-height: 1.1;
      text-shadow: 
        2px 2px 0 #000,
       -2px -2px 0 #000,
        2px -2px 0 #000,
       -2px 2px 0 #000,
        0px 4px 10px rgba(0, 0, 0, 0.95);
      text-align: left;
      margin-bottom: 2px;
    }

    .item .subtitulo {
      color: #00f2fe;
      font-weight: 900;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      line-height: 1.1;
      text-shadow: 
        2px 2px 0 #000,
       -2px -2px 0 #000,
        2px -2px 0 #000,
       -2px 2px 0 #000,
        0px 4px 10px rgba(0, 0, 0, 0.95);
      text-align: left;
      margin-bottom: 4px;
    }

    .item .precio-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .item .precio-box img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      filter: drop-shadow(0px 3px 6px rgba(0, 0, 0, 0.9));
    }

    .item .precio-box span {
      color: #ffea00;
      font-weight: 900;
      font-size: 24px;
      letter-spacing: 0.8px;
      line-height: 1;
      text-shadow: 
        2px 2px 0 #000,
       -2px -2px 0 #000,
        2px -2px 0 #000,
       -2px 2px 0 #000,
        0px 4px 10px rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="grid-3-vertical" id="contenedor"></div>
  </div>

  <script>
    const regalos = [
      { archivo: "regalos/Rosa.png", nombre: "Rosa", descripcion: "x5 Zombis", monedas: 1 },      
      { archivo: "regalos/GG.png", nombre: "GG", descripcion: "Perk Random", monedas: 1 },
      { archivo: "regalos/collar de amistad.png", nombre: "collar de amistad", descripcion: "lluvia de potenciadores", monedas: 10 },
      { archivo: "regalos/Helado.png", nombre: "Helado", descripcion: "Quitar un Perk", monedas: 1 },
      { archivo: "regalos/Corazon Coreano.png", nombre: "corazón Coreano", descripcion: "+1000 puntos", monedas: 5 },
      { archivo: "regalos/Globos.png", nombre: "Globos", descripcion: "Quitar puntos", monedas: 5 },
      { archivo: "regalos/exageracion.png", nombre: "exageración", descripcion: "Robar munición", monedas: 5 },
      { archivo: "regalos/Sombrero y bigote.png", nombre: "Sombrero y bigote", descripcion: "Reinicio", monedas: 99 },
      { archivo: "regalos/Rosa Blanca.png", nombre: "Rosa Blanca", descripcion: "Munición Máxima", monedas: 1 },
      { archivo: "regalos/Corazón.png", nombre: "corazón", descripcion: "tomar todas las armas", monedas: 10 },
      { archivo: "regalos/Pastel.png", nombre: "Pastel", descripcion: "Muerte Instantánea", monedas: 1 },                
      { archivo: "regalos/Dona.png", nombre: "Dona", descripcion: "Me quita todas las perks", monedas: 30 },
      { archivo: "regalos/futbol giratorio.png", nombre: "fútbol giratorio", descripcion: "Modo Dios 30 seg", monedas: 5 }
    ];

    const contenedor = document.getElementById('contenedor');
    let indiceActual = 0;
    const tiempoVisibilidad = 6000;

    function mostrarSiguienteGrupo() {
      contenedor.classList.add('oculto');

      setTimeout(() => {
        let grupo = regalos.slice(indiceActual, indiceActual + 3);

        if (grupo.length < 3) {
          const faltantes = 3 - grupo.length;
          const disponibles = regalos.filter(r => !grupo.includes(r));
          const aleatorios = disponibles.sort(() => 0.5 - Math.random()).slice(0, faltantes);
          grupo = [...grupo, ...aleatorios];
        }

        contenedor.innerHTML = grupo.map(item => `
          <div class="item">
            <div class="img-box">
              <img src="${encodeURI(item.archivo)}" alt="${item.nombre}">
            </div>
            <div class="info">
              <span class="titulo">${item.nombre}</span>
              <span class="subtitulo">${item.descripcion}</span>
              <div class="precio-box">
                <img src="regalos/moneda_tiktok.png" alt="moneda">
                <span>${item.monedas}</span>
              </div>
            </div>
          </div>
        `).join('');

        contenedor.classList.remove('oculto');

        indiceActual += 3;
        if (indiceActual >= regalos.length) {
          indiceActual = 0;
        }
      }, 500);
    }

    mostrarSiguienteGrupo();
    setInterval(mostrarSiguienteGrupo, tiempoVisibilidad);
  </script>

</body>
</html>
