<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent !important;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
    }

    .ticker-container {
      width: 100vw;
      overflow: hidden;
      background: transparent;
      padding: 10px 0;
    }

    .ticker-track {
      display: inline-flex;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    .block {
      display: inline-flex;
      gap: 55px;
      padding-right: 55px;
    }

    .item {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      flex-shrink: 0;
      width: 155px;
    }

    /* Nombre del objeto (ARRIBA) - Alineado Arriba (Flex-Start) */
    .item .titulo {
      height: 38px;
      display: flex;
      align-items: flex-start; /* Alinea los textos de 1 renglón arriba con la 1ª línea */
      justify-content: center;
      margin-bottom: 6px;
      color: #ffffff;
      font-weight: 900;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      line-height: 1.1;
      text-shadow: 
        2px 2px 0 #000,
       -1px -1px 0 #000,
        1px -1px 0 #000,
       -1px 1px 0 #000,
        0px 4px 8px rgba(0, 0, 0, 0.9);
      text-align: center;
      white-space: normal;
    }

    /* Icono PNG (CENTRO) */
    .item img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0px 6px 12px rgba(0, 0, 0, 0.85));
    }

    /* Descripción (ABAJO) - Alineado Arriba (Flex-Start) */
    .item .subtitulo {
      height: 38px;
      display: flex;
      align-items: flex-start; /* Alinea los textos de 1 renglón arriba con la 1ª línea */
      justify-content: center;
      margin-top: 6px;
      color: #ffd700;
      font-weight: 800;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.1;
      text-shadow: 
        2px 2px 0 #000,
       -1px -1px 0 #000,
        1px -1px 0 #000,
       -1px 1px 0 #000,
        0px 3px 6px rgba(0, 0, 0, 0.9);
      text-align: center;
      white-space: normal;
    }
  </style>
</head>
<body>

  <div class="ticker-container">
    <div class="ticker-track" id="track">
      <div class="block" id="block1"></div>
      <div class="block" id="block2"></div>
    </div>
  </div>

  <script>
    const regalos = [
      { archivo: "regalos/Rosa.png", nombre: "Rosa", descripcion: "x5<br>Zombis" },      
      { archivo: "regalos/GG.png", nombre: "GG", descripcion: "Perk<br>Random" },
      { archivo: "regalos/collar de amistad.png", nombre: "collar de<br> amistad", descripcion: "lluvia de<br>potenciadores" },
      { archivo: "regalos/Helado.png", nombre: "Helado", descripcion: "Quitar<br>un Perk" },
      { archivo: "regalos/Corazon Coreano.png", nombre: "cozazòn<br>Coreano", descripcion: "+1000<br>puntos" },
      { archivo: "regalos/Globos.png", nombre: "Globos", descripcion: "Quitar<br>puntos" },
      { archivo: "regalos/exageracion.png", nombre: "exageraciòn", descripcion: "Robar<br>municiòn" },
      { archivo: "regalos/Sombrero y bigote.png", nombre: "Sombrero y<br> bigote", descripcion: "Reinicio" },
      { archivo: "regalos/Rosa Blanca.png", nombre: "Rosa<br>Blanca", descripcion: "Munición<br>Máxima" },
      { archivo: "regalos/Corazón.png", nombre: "corazòn", descripcion: "tomar todas<br>las armas" },
      { archivo: "regalos/Pastel.png", nombre: "Pastel", descripcion: "Muerte<br>Instantánea" },                
      { archivo: "regalos/Dona.png", nombre: "Dona", descripcion: "Me quita<br>todas las perks" },
      { archivo: "regalos/futbol giratorio.png", nombre: "futbol<br> giratorio", descripcion: "Modo Dios<br> 30 seg" }
    ];

    const block1 = document.getElementById('block1');
    const block2 = document.getElementById('block2');
    const track = document.getElementById('track');

    function crearHTML(lista) {
      return lista.map(item => `
        <div class="item">
          <span class="titulo">${item.nombre}</span>
          <img src="${encodeURI(item.archivo)}" alt="${item.nombre}">
          <span class="subtitulo">${item.descripcion}</span>
        </div>
      `).join('');
    }

    const contenidoBase = crearHTML(regalos);

    block1.innerHTML = contenidoBase;
    block2.innerHTML = contenidoBase;

    let posX = 0;
    const velocidad = 1.0;
    let anchoBloque = 0;

    function animar() {
      posX -= velocidad;

      if (Math.abs(posX) >= anchoBloque) {
        posX = 0;
      }

      track.style.transform = `translate3d(${posX}px, 0, 0)`;
      requestAnimationFrame(animar);
    }

    window.addEventListener('load', () => {
      anchoBloque = block1.offsetWidth;
      requestAnimationFrame(animar);
    });
  </script>

</body>
</html>
